document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lay:flex;flex-direction:column;background:#0d2238;font-family:'Matter',system-ui,sans-serif;color:#ffffff;overflow:hidden\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 132px;gap:38px\">\n    <img src=\"de550709-6d5b-4f8c-a16e-eeb31a7d7b4a\" alt=\"Diploma Santé\" style=\"height:52px\">\n    <div style=\"display:inline-flex;align-items:center;gap:14px;background:rgba(211,171,103,0.16);border:1px solid rgba(211,171,103,0.5);border-radius:999px;padding:12px 26px\">\n      <span style=\"width:12px;height:12px;border-radius:999px;background:#d3ab67\"><\u002Fspan>\n      <span style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:21px;letter-spacing:0.06em;color:#d3ab67;white-space:nowrap\">WEBINAIRE · 45 MIN<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:125px;line-height:1.02;letter-spacing:-0.015em;margin:0;max-width:20ch\">Réforme PASS/LAS <span style=\"color:#4fabdb\">2027<\u002Fspan><\u002Fh1>\n    <p style=\"font-size:33px;line-height:1.5;color:#a3cceb;margin:0;max-width:36ch\">On vous explique tout : ce qui change, sur quoi se joue l’accès, et comment s’y préparer à temps.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 64px;font-size:21px;color:rgba(255,255,255,0.55)\">\n    <span>Médecine · Maïeutique · Odontologie · Pharmacie · Kinésithérapie<\u002Fspan>\n    <span>diploma-sante.fr<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"02\" data-label=\"Programme\" data-speaker-notes=\"Annoncer le plan en 30 secondes. Insister : la partie 2 est celle qui concerne directement les familles présentes.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">AU PROGRAMME<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Les 45 prochaines <span style=\"color:#2f86b6\">minutes<\u002Fspan><\u002Fh2>\n    <div style=\"margin-top:58px;background:#f4f7fa;border-radius:40px;padding:56px 64px;display:grid;grid-template-columns:1fr 1fr;gap:44px 64px\">\n      <div style=\"display:flex;align-items:flex-start;gap:28px\">\n        <span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:43px;color:#d3ab67;line-height:1\">01<\u002Fspan>\n        <div><div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px\">Comprendre la réforme<\u002Fdiv><div style=\"font-size:21px;color:#5b6b7c;margin-top:10px\">Ce qui change, ce qui ne change pas<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:28px\">\n        <span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:43px;color:#d3ab67;line-height:1\">02<\u002Fspan>\n        <div><div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px\">Le vrai enjeu : anticiper<\u002Fdiv><div style=\"font-size:21px;color:#5b6b7c;margin-top:10px\">Du concours au parcours<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:28px\">\n        <span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:43px;color:#d3ab67;line-height:1\">03<\u002Fspan>\n        <div><div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px\">Se préparer avec Diploma Santé<\u002Fdiv><div style=\"font-size:21px;color:#5b6b7c;margin-top:10px\">Première Élite et Terminale Santé<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:28px\">\n        <span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:43px;color:#d3ab67;line-height:1\">04<\u002Fspan>\n        <div><div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px\">Vos questions<\u002Fdiv><div style=\"font-size:21px;color:#5b6b7c;margin-top:10px\">Échange avec l’équipe pédagogique<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 54px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03\" data-label=\"Qui est concerné\" data-speaker-notes=\"Point de clarification essentiel dès le début, pour éviter les malentendus : les bacheliers 2026 ne sont pas concernés.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">PÉRIMÈTRE<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Qui est <span style=\"color:#2f86b6\">concerné<\u002Fspan><\u002Fh2>\n    <div style=\"margin-top:58px;display:grid;grid-template-columns:1fr 1fr;gap:32px\">\n      <div style=\"background:#f1f7fb;border:1px solid #cfe3f2;border-radius:32px;padding:52px 56px\">\n        <span style=\"display:inline-flex;width:52px;height:52px;border-radius:999px;background:#2f86b6;align-items:center;justify-content:center;margin-bottom:26px\"><span style=\"width:16px;height:16px;border-radius:999px;background:#ffffff\"><\u002Fspan><\u002Fspan>\n        <h3 style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:37px;margin:0 0 18px\">Concernés<\u002Fh3>\n        <p style=\"font-size:25px;line-height:1.5;color:#3f5062;margin:0\">Les lycéens actuellement en Première et en Terminale, ainsi que leurs parents. Ce sont les bacheliers 2027 qui entreront dans la nouvelle voie d’accès unique.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f8fafb;border:1px solid #e6eaee;border-radius:32px;padding:52px 56px\">\n        <span style=\"display:inline-flex;width:52px;height:52px;border-radius:999px;background:#c6cfd8;align-items:center;justify-content:center;margin-bottom:26px\"><span style=\"width:22px;height:4px;border-radius:999px;background:#ffffff\"><\u002Fspan><\u002Fspan>\n        <h3 style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:37px;margin:0 0 18px\">Non concernés<\u002Fh3>\n        <p style=\"font-size:25px;line-height:1.5;color:#3f5062;margin:0\">Les bacheliers 2026 : ils entrent dans le système PASS/LAS actuel et le suivent jusqu’au bout. La rentrée 2026 est la dernière promotion PASS/LAS.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 54px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04\" data-label=\"01 · Comprendre\" data-speaker-notes=\"Transition : d’abord les faits, ensuite ce qu’il faut en faire.\" style=\"display:flex;flex-direction:column;background:#12314d;font-family:'Matter',system-ui,sans-serif;color:#ffffff;overflow:hidden\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 132px;gap:28px\">\n    <span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:197px;line-height:0.9;color:#1e4a72\">01<\u002Fspan>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:85px;line-height:1.06;margin:0\">Comprendre la <span style=\"color:#d3ab67\">réforme<\u002Fspan><\u002Fh2>\n    <p style=\"font-size:29px;color:#a3cceb;margin:0;max-width:44ch\">Ce que disent les textes annoncés le 17 avril 2026, et ce qu’il reste à confirmer.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05\" data-label=\"Ce qui change\" data-speaker-notes=\"17 avril 2026 : annonce officielle. Souligner l’intégration pleine de la kinésithérapie, nouveauté peu connue. Rappeler que « Licence Portail Santé » est une dénomination de travail.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">RENTRÉE 2027<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Ce qui change <span style=\"color:#2f86b6\">vraiment<\u002Fspan><\u002Fh2>\n    <div style=\"margin-top:54px;display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <div style=\"background:#ffffff;border:1px solid #e6eaee;border-radius:28px;padding:44px 48px;box-shadow:0 12px 30px rgba(18,49,77,0.05)\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:29px;margin-bottom:14px\">Une voie d’accès unique<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.5;color:#5b6b7c;margin:0\">Nationale, accessible sur Parcoursup, elle remplace à la fois le PASS et la LAS.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #e6eaee;border-radius:28px;padding:44px 48px;box-shadow:0 12px 30px rgba(18,49,77,0.05)\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:29px;margin-bottom:14px\">Cinq filières, une sélection<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.5;color:#5b6b7c;margin:0\">MMOPK partagent une première phase commune — la kinésithérapie y est désormais pleinement intégrée.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #e6eaee;border-radius:28px;padding:44px 48px;box-shadow:0 12px 30px rgba(18,49,77,0.05)\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:29px;margin-bottom:14px\">Une première année en trois blocs<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.5;color:#5b6b7c;margin:0\">Un bloc santé, un bloc disciplinaire choisi par l’étudiant, un bloc transversal.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f1f7fb;border:1px solid #cfe3f2;border-radius:28px;padding:44px 48px\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:29px;margin-bottom:14px\">Un nom encore provisoire<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.5;color:#3f5062;margin:0\">« Licence Portail Santé » est l’appellation employée dans les projets de textes. Elle n’est pas définitivement fixée.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 54px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"06\" data-label=\"Avant / après\" data-speaker-notes=\"La diapositive de référence du webinaire. Prendre le temps ligne par ligne ; c’est celle que les parents photographient. Ajouter à l’oral : le numerus apertus national laisse place à des capacités d’accueil fixées par les universités (loi Neuder).\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">COMPARATIF<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Avant / <span style=\"color:#2f86b6\">après<\u002Fspan><\u002Fh2>\n    <div style=\"margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <div style=\"background:#f8fafb;border:1px solid #e6eaee;border-radius:32px;padding:44px 48px\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;color:#5b6b7c;margin-bottom:30px\">Jusqu’en 2026<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;font-size:24px;line-height:1.4;color:#3f5062\">\n          <div style=\"border-top:1px solid #e6eaee;padding-top:22px\">PASS ou LAS, à choisir dès Parcoursup<\u002Fdiv>\n          <div style=\"border-top:1px solid #e6eaee;padding-top:22px\">Un concours en fin d’année<\u002Fdiv>\n          <div style=\"border-top:1px solid #e6eaee;padding-top:22px\">Redoublement interdit en PASS<\u002Fdiv>\n          <div style=\"border-top:1px solid #e6eaee;padding-top:22px\">Filet de sécurité variable selon la voie<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#12314d;border-radius:32px;padding:44px 48px;color:#ffffff\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;color:#d3ab67;margin-bottom:30px\">À partir de 2027<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;font-size:24px;line-height:1.4\">\n          <div style=\"border-top:1px solid rgba(255,255,255,0.18);padding-top:22px\">Une voie unique nationale<\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(255,255,255,0.18);padding-top:22px\">L’ensemble du parcours académique<\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(255,255,255,0.18);padding-top:22px\">Redoublement possible en 1re année<\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(255,255,255,0.18);padding-top:22px\">Le bloc disciplinaire, choisi sur Parcoursup<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 54px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"07\" data-label=\"Les trois blocs\" data-speaker-notes=\"Expliquer la logique : un bloc qui classe, un bloc qui sécurise, un bloc qui répond à une demande des professionnels. Préciser que l’offre de disciplines d’appui varie selon les universités.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">LA PREMIÈRE ANNÉE<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Trois <span style=\"color:#2f86b6\">blocs<\u002Fspan>, 60 ECTS<\u002Fh2>\n    <div style=\"margin-top:54px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px\">\n      <div style=\"background:#ffffff;border:1px solid #e6eaee;border-radius:28px;padding:44px 44px;box-shadow:0 12px 30px rgba(18,49,77,0.05);display:flex;flex-direction:column\">\n        <span style=\"align-self:flex-start;background:#2f86b6;color:#ffffff;border-radius:999px;padding:10px 22px;font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.04em\">24–30 ECTS<\u002Fspan>\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;margin:26px 0 14px\">Bloc santé<\u002Fdiv>\n        <p style=\"font-size:22px;line-height:1.5;color:#5b6b7c;margin:0\">Biologie cellulaire, chimie, biochimie, anatomie, physiologie, santé publique. Le socle scientifique commun, et le bloc classant.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #e6eaee;border-radius:28px;padding:44px 44px;box-shadow:0 12px 30px rgba(18,49,77,0.05);display:flex;flex-direction:column\">\n        <span style=\"align-self:flex-start;background:#d3ab67;color:#12314d;border-radius:999px;padding:10px 22px;font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.04em\">24–30 ECTS<\u002Fspan>\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;margin:26px 0 14px\">Bloc disciplinaire<\u002Fdiv>\n        <p style=\"font-size:22px;line-height:1.5;color:#5b6b7c;margin:0\">Biologie, chimie, maths, droit, psychologie, SHS, STAPS, sciences infirmières. La discipline d’appui, choisie par l’étudiant.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #e6eaee;border-radius:28px;padding:44px 44px;box-shadow:0 12px 30px rgba(18,49,77,0.05);display:flex;flex-direction:column\">\n        <span style=\"align-self:flex-start;background:#a3cceb;color:#12314d;border-radius:999px;padding:10px 22px;font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.04em\">6–12 ECTS<\u002Fspan>\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;margin:26px 0 14px\">Bloc transversal<\u002Fdiv>\n        <p style=\"font-size:22px;line-height:1.5;color:#5b6b7c;margin:0\">Communication, éthique médicale, raisonnement scientifique, travail en équipe. Les compétences humaines du soin.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 54px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"08\" data-label=\"La sélection\" data-speaker-notes=\"La distinction la plus mal comprise : être éligible n’est pas être classé. Éligibilité = valider les deux blocs avec 10/20 sur chacun. Classement = les quatre éléments ci-dessous, oraux encouragés.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:76px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">CLASSEMENT<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:69px;line-height:1.06;margin:16px 0 0\">Sur quoi se joue la <span style=\"color:#2f86b6\">sélection<\u002Fspan><\u002Fh2>\n    <div style=\"margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:30px\">\n      <div style=\"background:#f1f7fb;border-radius:28px;padding:44px 50px\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;margin-bottom:14px\">Résultats du bloc santé<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.5;color:#3f5062;margin:0\">Le bloc classant : le cœur médical du cursus.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f1f7fb;border-radius:28px;padding:44px 50px\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;margin-bottom:14px\">Résultats du bloc disciplinaire<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.5;color:#3f5062;margin:0\">La discipline d’appui compte aussi dans le classement.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f8f5ee;border-radius:28px;padding:44px 50px\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;margin-bottom:14px\">Compétences transversales<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.5;color:#3f5062;margin:0\">Communication, éthique, travail en équipe.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f8f5ee;border-radius:28px;padding:44px 50px\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;margin-bottom:14px\">Ensemble du parcours<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.5;color:#3f5062;margin:0\">Toute l’année académique, pas une épreuve unique.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:30px;background:#12314d;border-radius:28px;padding:38px 50px;display:flex;align-items:center;justify-content:space-between;gap:40px;color:#ffffff\">\n      <span style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:27px\">Éligible : 10/20 sur chacun des deux blocs<\u002Fspan>\n      <span style=\"font-size:22px;color:#a3cceb\">Modalités fixées par chaque université — maquettes en novembre 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 48px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"09\" data-label=\"Deux chances\" data-speaker-notes=\"Mécanique décisive. Bien poser le piège : redoubler ne redonne pas une chance immédiate de candidater.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">DEUX CHANCES<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Candidatures et <span style=\"color:#2f86b6\">redoublement<\u002Fspan><\u002Fh2>\n    <div style=\"margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <div style=\"background:#f1f7fb;border:1px solid #cfe3f2;border-radius:32px;padding:44px 48px\">\n        <span style=\"display:inline-block;background:#2f86b6;color:#ffffff;border-radius:999px;padding:10px 24px;font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;margin-bottom:24px\">BLOCS VALIDÉS<\u002Fspan>\n        <p style=\"font-size:24px;line-height:1.5;color:#3f5062;margin:0\">1re candidature MMOPK. Si admis : entrée en filière. Sinon, passage en 2e année et seconde candidature. En cas de nouvel échec : poursuite en licence disciplinaire.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f8fafb;border:1px solid #e6eaee;border-radius:32px;padding:44px 48px\">\n        <span style=\"display:inline-block;background:#5b6b7c;color:#ffffff;border-radius:999px;padding:10px 24px;font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;margin-bottom:24px\">BLOCS NON VALIDÉS<\u002Fspan>\n        <p style=\"font-size:24px;line-height:1.5;color:#3f5062;margin:0\">Redoublement de la 1re année, sans candidature possible cette année-là. Il faudra passer en deuxième année pour retenter la sélection.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:30px 0 0;font-size:21px;color:#5b6b7c\">Des passerelles sont prévues pour les titulaires d’une licence complète et certains profils paramédicaux.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 54px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"10\" data-label=\"Citation · le piège\" data-speaker-notes=\"Marquer une pause ici. C’est la phrase à retenir de la partie 1.\" style=\"display:flex;flex-direction:column;background:#12314d;font-family:'Matter',system-ui,sans-serif;color:#ffffff\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 180px;gap:40px\">\n    <span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:137px;line-height:0.6;color:#d3ab67\">“<\u002Fspan>\n    <p style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:500;font-size:73px;line-height:1.2;margin:0\">Le redoublement sert à consolider, pas à rejouer un tour.<\u002Fp>\n    <span style=\"font-size:23px;color:#a3cceb\">Guide Réforme PASS/LAS — Diploma Santé<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"11\" data-label=\"Ce qui ne change pas\" data-speaker-notes=\"Contrer le contresens le plus fréquent : simplifier n’est pas faciliter. Mentionner la loi Neuder (juin 2025) et la fin du numerus apertus.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">MISE AU POINT<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Ce qui ne change <span style=\"color:#2f86b6\">pas<\u002Fspan><\u002Fh2>\n    <div style=\"margin-top:54px;background:#f4f7fa;border-radius:40px;padding:52px 60px;display:flex;flex-direction:column;gap:34px\">\n      <div style=\"display:flex;align-items:flex-start;gap:26px\"><span style=\"width:18px;height:18px;border-radius:999px;background:#d3ab67;margin-top:12px;flex:none\"><\u002Fspan><span style=\"font-size:28px;line-height:1.4\">La sélection est maintenue : les places restent limitées et la demande très forte.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:26px\"><span style=\"width:18px;height:18px;border-radius:999px;background:#d3ab67;margin-top:12px;flex:none\"><\u002Fspan><span style=\"font-size:28px;line-height:1.4\">L’exigence scientifique reste intacte — le bloc santé demeure dense et sélectif.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:26px\"><span style=\"width:18px;height:18px;border-radius:999px;background:#d3ab67;margin-top:12px;flex:none\"><\u002Fspan><span style=\"font-size:28px;line-height:1.4\">Les facteurs de réussite sont inchangés : compétences scientifiques, rigueur, organisation.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:26px\"><span style=\"width:18px;height:18px;border-radius:999px;background:#2f86b6;margin-top:12px;flex:none\"><\u002Fspan><span style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:28px;line-height:1.4\">Le chemin devient plus lisible, pas plus court.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 54px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"12\" data-label=\"02 · Anticiper\" data-speaker-notes=\"Changement de registre : on passe de l’information à l’action.\" style=\"display:flex;flex-direction:column;background:#12314d;font-family:'Matter',system-ui,sans-serif;color:#ffffff;overflow:hidden\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 132px;gap:28px\">\n    <span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:197px;line-height:0.9;color:#1e4a72\">02<\u002Fspan>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:85px;line-height:1.06;margin:0\">Le vrai enjeu : <span style=\"color:#d3ab67\">anticiper<\u002Fspan><\u002Fh2>\n    <p style=\"font-size:29px;color:#a3cceb;margin:0;max-width:44ch\">Ce que la bascule du concours vers le parcours change pour un lycéen dès aujourd’hui.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"13\" data-label=\"Concours → parcours\" data-speaker-notes=\"Conséquence directe et sous-estimée : la régularité l’emporte sur le bachotage. Et ce parcours commence avant la première année.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">BASCULE<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Du concours au <span style=\"color:#2f86b6\">parcours<\u002Fspan><\u002Fh2>\n    <div style=\"margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <div style=\"background:#f8fafb;border:1px solid #e6eaee;border-radius:32px;padding:44px 48px\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;color:#5b6b7c;margin-bottom:18px\">Hier — une performance concentrée<\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.5;color:#3f5062;margin:0\">Un concours, une échéance, un couperet. On pouvait miser sur une montée en charge finale.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f1f7fb;border:1px solid #cfe3f2;border-radius:32px;padding:44px 48px\">\n        <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:31px;color:#2f86b6;margin-bottom:18px\">Demain — l’ensemble du parcours<\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.5;color:#3f5062;margin:0\">Le classement s’appuie sur toute l’année académique. Méthode de travail, solidité des bases et capacité à tenir un rythme deviennent ce qui départage.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:30px;background:#12314d;border-radius:26px;padding:32px 44px;color:#ffffff;font-family:'Clash Display',sans-serif;font-weight:600;font-size:28px\">On ne rattrape pas un an de parcours en trois semaines de révisions.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 132px 48px;font-size:21px;color:#5b6b7c\">\n    <img src=\"9a039a89-e011-4055-b36c-e254820c2451\" alt=\"Diploma Santé\" style=\"height:28px;opacity:0.85\">\n    <span>Réforme PASS/LAS 2027<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"14\" data-label=\"Pourquoi tout se joue avant\" data-speaker-notes=\"Le rythme universitaire du bloc santé : en quelques semaines on traite ce qui prendrait des mois en terminale. L’écart de départ se creuse dès les premières évaluations.\" style=\"display:flex;flex-direction:row;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d;overflow:hidden\">\n  <div style=\"width:46%;flex:none;position:relative;overflow:hidden\">\n    <img src=\"652fb15d-4498-418b-80f8-4f868302216d\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;object-position:center 60%;filter:saturate(0.6)\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,34,56,0.35) 0%,rgba(13,34,56,0) 55%,rgba(255,255,255,0.9) 100%)\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 110px;gap:34px\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">L’ÉCART DE DÉPART<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:65px;line-height:1.06;margin:0\">Pourquoi tout se joue <span style=\"color:#2f86b6\">avant<\u002Fspan><\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:26px\">\n      <div style=\"display:flex;align-items:flex-start;gap:22px\"><span style=\"width:16px;height:16px;border-radius:999px;background:#c6cfd8;margin-top:11px;flex:none\"><\u002Fspan><span style=\"font-size:25px;line-height:1.45;color:#3f5062\">Sans préparation : bases fragiles, pas de méthode installée, une année passée à rattraper.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:22px\"><span style=\"width:16px;height:16px;border-radius:999px;background:#2f86b6;margin-top:11px;flex:none\"><\u002Fspan><span style=\"font-size:25px;line-height:1.45;color:#3f5062\">Préparé : bases solides, méthode rodée, le rythme suivi dès le départ.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:22px\"><span style=\"width:16px;height:16px;border-radius:999px;background:#d3ab67;margin-top:11px;flex:none\"><\u002Fspan><span style=\"font-size:25px;line-height:1.45;color:#3f5062\">Dans un classement où quelques dixièmes séparent les admis des recalés, cet écart pèse lourd.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"15\" data-label=\"Citation · rythme\" data-speaker-notes=\"Laisser respirer, puis enchaîner sur la checklist : voilà concrètement quoi faire.\" style=\"display:flex;flex-direction:column;background:#12314d;font-family:'Matter',system-ui,sans-serif;color:#ffffff\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 180px;gap:40px\">\n    <span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:137px;line-height:0.6;color:#d3ab67\">“<\u002Fspan>\n    <p style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:500;font-size:69px;line-height:1.2;margin:0\">Ce n’est pas le plus rapide qui réussit, c’est celui qui n’a pas de retard à combler.<\u002Fp>\n    <span style=\"font-size:23px;color:#a3cceb\">Guide Réforme PASS/LAS — Diploma Santé<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"16\" data-label=\"Checklist 1/2\" data-speaker-notes=\"Anticiper ne veut pas dire se surcharger, mais faire les bons choix au bon moment.\" style=\"display:flex;flex-direction:column;background:#ffffff;font-family:'Matter',system-ui,sans-serif;color:#12314d\">\n  <div style=\"height:8px;background:linear-gradient(90deg,#4fabdb 0%,#d3ab67 42%,rgba(211,171,103,0) 100%)\"><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:80px 132px 0\">\n    <div style=\"font-family:'Clash Display',sans-serif;font-weight:600;font-size:22px;letter-spacing:0.14em;color:#b8893a\">CHECKLIST TERMINALE · 1/2<\u002Fdiv>\n    <h2 style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:73px;line-height:1.06;margin:18px 0 0\">Les <span style=\"color:#2f86b6\">bases<\u002Fspan> à sécuriser<\u002Fh2>\n    <div style=\"margin-top:54px;display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <div style=\"background:#ffffff;border:1px solid #e6eaee;border-radius:28px;padding:40px 44px;box-shadow:0 12px 30px rgba(18,49,77,0.05);display:flex;gap:26px\"><span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:37px;color:#d3ab67;line-height:1\">01<\u002Fspan><span style=\"font-size:24px;line-height:1.45;color:#3f5062\">Soigner ses spécialités scientifiques — maths, physique-chimie, SVT pèsent dans le dossier.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #e6eaee;border-radius:28px;padding:40px 44px;box-shadow:0 12px 30px rgba(18,49,77,0.05);display:flex;gap:26px\"><span style=\"font-family:'PP Pangaia',Georgia,serif;font-weight:700;font-size:37px;color:#d3ab67;line-height:1\">02<\u002Fspan><span style=\"font-size:24px;line-height:1.45;color:#3f5062\">Viser la régularité, pas les à-coups : chaque trimestre compte.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px
